<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Tante Emma System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>Tante Emma Shop</h1>
    <p>Live Backend System (Flask API)</p>
</header>

<nav>
    <button onclick="loadArtikel()">🛒 Artikel laden</button>
    <button onclick="loadKunden()">👤 Kunden laden</button>
    <button onclick="loadBestellungen()">📦 Bestellungen</button>
    <button onclick="loadLieferungen()">🚚 Lieferungen</button>
</nav>

<main>

    <section class="card">
        <h2>📡 Datenbereich</h2>
        <div id="output">Klicke oben auf einen Button...</div>
    </section>

</main>

<footer>
    <p>Flask + API Connected Frontend</p>
</footer>

<script>
const output = document.getElementById("output");

/* ---------------------------
   GENERIC RENDER FUNCTION
---------------------------- */
function render(data) {
    output.innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
}

/* ---------------------------
   ARTIKEL
---------------------------- */
async function loadArtikel() {
    const res = await fetch("/artikel/");
    const data = await res.json();
    render(data);
}

/* ---------------------------
   KUNDEN
---------------------------- */
async function loadKunden() {
    const res = await fetch("/kunden/");
    const data = await res.json();
    render(data);
}

/* ---------------------------
   BESTELLUNGEN
---------------------------- */
async function loadBestellungen() {
    const res = await fetch("/bestellungen/");
    const data = await res.json();
    render(data);
}

/* ---------------------------
   LIEFERUNGEN
---------------------------- */
async function loadLieferungen() {
    const res = await fetch("/lieferungen/");
    const data = await res.json();
    render(data);
}
</script>

</body>
</html>
