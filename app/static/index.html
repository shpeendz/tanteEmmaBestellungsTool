<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tante Emma Shop</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>

    <!-- ✅ DEIN CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

<!-- HEADER -->
<header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
        <div class="bg-teal-500 rounded-lg w-8 h-8 flex items-center justify-center text-black font-bold text-sm">T</div>
        <h1 class="text-lg font-semibold">Tante Emma Shop</h1>
    </div>

    <button onclick="toggleWarenkorb()"
        class="relative flex items-center gap-2 bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm transition">
        🛒 Warenkorb
        <span id="warenkorb-anzahl"
            class="bg-teal-500 text-black text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">
            0
        </span>
    </button>
</header>

<!-- MAIN -->
<div class="flex flex-1">

    <!-- ARTIKEL -->
    <main class="flex-1 p-6">
        <h2 class="text-xl font-semibold mb-6">Unser Sortiment</h2>

        <div id="artikel-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <p class="text-gray-500 text-sm">Lädt Artikel...</p>
        </div>
    </main>

    <!-- WARENKORB -->
    <aside id="warenkorb-panel"
        class="hidden w-80 bg-gray-900 border-l border-gray-800 p-5 flex flex-col">

        <h2 class="text-base font-semibold mb-4">🛒 Warenkorb</h2>

        <div id="warenkorb-liste" class="flex-1 flex flex-col gap-2 overflow-y-auto"></div>

        <div class="border-t border-gray-800 pt-4 mt-4">

            <div class="flex justify-between text-sm mb-4">
                <span class="text-gray-400">Gesamt</span>
                <span class="font-bold text-teal-400" id="warenkorb-gesamt">0.00 €</span>
            </div>

            <input id="kunde-name" type="text" placeholder="Dein Name"
                class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm w-full mb-2">

            <input id="kunde-email" type="email" placeholder="Deine E-Mail"
                class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm w-full mb-3">

            <button onclick="bestellungAufgeben()"
                class="w-full bg-teal-500 hover:bg-teal-400 text-black font-semibold py-2 rounded-lg text-sm">
                Bestellung aufgeben
            </button>

            <button onclick="warenkorbLeeren()"
                class="w-full mt-2 text-gray-500 hover:text-gray-300 text-xs">
                Warenkorb leeren
            </button>
        </div>
    </aside>

</div>

<!-- SUCCESS MODAL -->
<div id="erfolg-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 max-w-sm w-full text-center">
        <div class="text-5xl mb-4">🎉</div>
        <h3 class="text-xl font-bold mb-2">Bestellung aufgegeben!</h3>
        <p class="text-gray-400 text-sm mb-6">Deine Bestellung wurde erfolgreich gespeichert.</p>
        <button onclick="schliesseModal()"
            class="bg-teal-500 hover:bg-teal-400 text-black font-semibold px-6 py-2 rounded-lg text-sm">
            Weiter einkaufen
        </button>
    </div>
</div>

<!-- 🆕 EDIT MODAL (PUT SUPPORT) -->
<div id="edit-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 max-w-md w-full">

        <h3 class="text-lg font-bold mb-4">Artikel bearbeiten</h3>

        <input id="edit-name" class="w-full mb-2 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
               placeholder="Bezeichnung">

        <input id="edit-preis" type="number" step="0.01"
               class="w-full mb-2 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
               placeholder="Preis">

        <input id="edit-bestand" type="number"
               class="w-full mb-2 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
               placeholder="Bestand">

        <input id="edit-kategorie"
               class="w-full mb-4 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
               placeholder="Kategorie">

        <div class="flex gap-2">
            <button onclick="saveArtikelUpdate()"
                class="flex-1 bg-teal-500 hover:bg-teal-400 text-black font-semibold py-2 rounded">
                Speichern
            </button>

            <button onclick="closeEditModal()"
                class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 rounded">
                Abbrechen
            </button>
        </div>
    </div>
</div>

<!-- SCRIPT -->
<script>
let warenkorb = [];
let editArtikelId = null;

// Warenkorb togglen
function toggleWarenkorb() {
    const panel = document.getElementById('warenkorb-panel');
    panel.classList.toggle('hidden');
    panel.classList.toggle('flex');
}

// Artikel laden
async function ladeArtikel() {
    const data = await fetch("/api/artikel").then(r => r.json());
    const grid = document.getElementById('artikel-grid');

    grid.innerHTML = data.map(a => `
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col gap-3">

            <div class="text-4xl">${kategorieIcon(a.kategorie)}</div>

            <h3 class="font-medium text-sm">${a.bezeichnung}</h3>

            <p class="text-xs text-gray-500">${a.kategorie ?? '–'}</p>

            <div class="flex justify-between text-sm">
                <span class="text-teal-400 font-bold">${a.preis.toFixed(2)} €</span>
                <span class="text-xs text-gray-600">Bestand: ${a.bestand}</span>
            </div>

            <div class="flex gap-2">

                ${a.bestand > 0
                    ? `<button onclick="inWarenkorb(${a.id}, '${a.bezeichnung}', ${a.preis})"
                        class="flex-1 bg-gray-800 hover:bg-teal-900 text-sm py-1.5 rounded">
                        + Warenkorb
                    </button>`
                    : `<button disabled class="flex-1 bg-gray-800 text-gray-600 text-sm py-1.5 rounded">
                        Ausverkauft
                    </button>`
                }

                <button onclick="openEditModal(${a.id}, '${a.bezeichnung}', ${a.preis}, ${a.bestand}, '${a.kategorie}')"
                    class="px-3 bg-gray-700 hover:bg-gray-600 rounded">
                    ✏️
                </button>

            </div>
        </div>
    `).join('');
}

// Kategorie Icon
function kategorieIcon(kat) {
    const icons = {
        'Obst': '🍎',
        'Milch': '🥛',
        'Bio': '🌿',
        'Backwaren': '🍞',
        'Gemüse': '🥦',
        'Fleisch': '🥩'
    };
    return icons[kat] ?? '📦';
}

// EDIT OPEN
function openEditModal(id, name, preis, bestand, kategorie) {
    editArtikelId = id;

    document.getElementById('edit-name').value = name;
    document.getElementById('edit-preis').value = preis;
    document.getElementById('edit-bestand').value = bestand;
    document.getElementById('edit-kategorie').value = kategorie;

    document.getElementById('edit-modal').classList.remove('hidden');
}

// CLOSE EDIT
function closeEditModal() {
    document.getElementById('edit-modal').classList.add('hidden');
}

// PUT REQUEST
async function saveArtikelUpdate() {
    const data = {
        bezeichnung: document.getElementById('edit-name').value,
        preis: parseFloat(document.getElementById('edit-preis').value),
        bestand: parseInt(document.getElementById('edit-bestand').value),
        kategorie: document.getElementById('edit-kategorie').value
    };

    await fetch(`/api/artikel/${editArtikelId}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    closeEditModal();
    ladeArtikel();
}

// INIT
ladeArtikel();
</script>

</body>
</html>
