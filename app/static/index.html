<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tante Emma Shop</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

<header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
        <div class="bg-teal-500 rounded-lg w-8 h-8 flex items-center justify-center text-black font-bold text-sm">T</div>
        <h1 class="text-lg font-semibold">Tante Emma Shop</h1>
    </div>

    <button id="warenkorb-toggle"
        class="relative flex items-center gap-2 bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm transition">
        🛒 Warenkorb
        <span id="warenkorb-anzahl"
            class="bg-teal-500 text-black text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">
            0
        </span>
    </button>
</header>

<div class="flex flex-1">
    <main class="flex-1 p-6">
        <h2 class="text-xl font-semibold mb-6">Unser Sortiment</h2>
        <div id="artikel-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <p class="text-gray-500 text-sm">Lädt Artikel...</p>
        </div>
    </main>

    <aside id="warenkorb-panel"
        class="hidden w-80 bg-gray-900 border-l border-gray-800 p-5 flex-col">
        <h2 class="text-base font-semibold mb-4">🛒 Warenkorb</h2>

        <div id="warenkorb-liste" class="flex-1 flex flex-col gap-2 overflow-y-auto">
            <p class="text-sm text-gray-500">Noch keine Artikel im Warenkorb.</p>
        </div>

        <div class="border-t border-gray-800 pt-4 mt-4">
            <div class="flex justify-between text-sm mb-4">
                <span class="text-gray-400">Gesamt</span>
                <span class="font-bold text-teal-400" id="warenkorb-gesamt">0.00 €</span>
            </div>

            <input id="kunde-name" type="text" placeholder="Dein Vor- und Nachname"
                class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm w-full mb-2">

            <input id="kunde-email" type="email" placeholder="Deine E-Mail"
                class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm w-full mb-3">

            <button id="bestellung-button"
                class="w-full bg-teal-500 hover:bg-teal-400 text-black font-semibold py-2 rounded-lg text-sm">
                Bestellung aufgeben
            </button>

            <button id="warenkorb-leeren"
                class="w-full mt-2 text-gray-500 hover:text-gray-300 text-xs">
                Warenkorb leeren
            </button>
        </div>
    </aside>
</div>

<div id="erfolg-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 max-w-sm w-full text-center">
        <div class="text-5xl mb-4">🎉</div>
        <h3 class="text-xl font-bold mb-2">Bestellung aufgegeben!</h3>
        <p class="text-gray-400 text-sm mb-6">Deine Bestellung wurde erfolgreich gespeichert.</p>
        <button id="modal-close"
            class="bg-teal-500 hover:bg-teal-400 text-black font-semibold px-6 py-2 rounded-lg text-sm">
            Weiter einkaufen
        </button>
    </div>
</div>

<div id="edit-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 max-w-md w-full">
        <h3 class="text-lg font-bold mb-4">Artikel bearbeiten</h3>

        <input id="edit-name" class="w-full mb-2 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
               placeholder="Bezeichnung">

        <input id="edit-preis" type="number" step="0.01"
               class="w-full mb-2 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
               placeholder="Preis">

        <input id="edit-bestand" type="number"
               class="w-full mb-2 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
               placeholder="Bestand">

        <input id="edit-kategorie"
               class="w-full mb-4 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm"
               placeholder="Kategorie">

        <div class="flex gap-2">
            <button id="edit-save"
                class="flex-1 bg-teal-500 hover:bg-teal-400 text-black font-semibold py-2 rounded">
                Speichern
            </button>

            <button id="edit-cancel"
                class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 rounded">
                Abbrechen
            </button>
        </div>
    </div>
</div>

<script>
// *************** WARENKORB ***************
let warenkorb = [];
let editArtikelId = null;

// DOM Elemente
const artikelGrid = document.getElementById("artikel-grid");
const warenkorbPanel = document.getElementById("warenkorb-panel");
const warenkorbListe = document.getElementById("warenkorb-liste");
const warenkorbAnzahl = document.getElementById("warenkorb-anzahl");
const warenkorbGesamt = document.getElementById("warenkorb-gesamt");
const erfolgModal = document.getElementById("erfolg-modal");
const editModal = document.getElementById("edit-modal");

// Event Listeners
document.getElementById("warenkorb-toggle").addEventListener("click", toggleWarenkorb);
document.getElementById("warenkorb-leeren").addEventListener("click", warenkorbLeeren);
document.getElementById("bestellung-button").addEventListener("click", bestellungAufgeben);
document.getElementById("modal-close").addEventListener("click", () => erfolgModal.classList.add("hidden"));
document.getElementById("edit-cancel").addEventListener("click", () => editModal.classList.add("hidden"));
document.getElementById("edit-save").addEventListener("click", saveArtikelUpdate);

// Warenkorb öffnen/schließen
function toggleWarenkorb() {
    warenkorbPanel.classList.toggle("hidden");
    warenkorbPanel.classList.toggle("flex");
}

// Kategorie Icon
function kategorieIcon(kat) {
    const icons = {
        Obst: "🍎",
        Milch: "🥛",
        Bio: "🌿",
        Backwaren: "🍞",
        Gemüse: "🥦",
        Fleisch: "🥩"
    };
    return icons[kat] || "📦";
}

// HTML escaping (verhindert Fehler bei Apostrophen)
function escapeHtml(text) {
    const map = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    };
    return String(text).replace(/[&<>"']/g, m => map[m]);
}

// Artikel laden
async function ladeArtikel() {
    console.log("Artikel werden geladen...");
    artikelGrid.innerHTML = '<p class="text-gray-500 text-sm">Lädt Artikel...</p>';

    try {
        const response = await fetch("/api/artikel");
        console.log("Response Status:", response.status);

        if (!response.ok) {
            console.error("HTTP Error:", response.status);
            throw new Error("Artikel konnten nicht geladen werden");
        }

        const artikel = await response.json();
        console.log("Artikel geladen:", artikel);

        if (artikel.length === 0) {
            artikelGrid.innerHTML = '<p class="text-gray-500 text-sm">Keine Artikel gefunden.</p>';
            return;
        }

        // HTML rendern
        artikelGrid.innerHTML = artikel.map(a => `
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex flex-col gap-3">
                <div class="text-4xl">${kategorieIcon(a.kategorie)}</div>
                <h3 class="font-medium text-sm">${escapeHtml(a.bezeichnung)}</h3>
                <p class="text-xs text-gray-500">${escapeHtml(a.kategorie || "–")}</p>
                <div class="flex justify-between text-sm">
                    <span class="text-teal-400 font-bold">${a.preis.toFixed(2)} €</span>
                    <span class="text-xs text-gray-600">Bestand: ${a.bestand}</span>
                </div>
                <div class="flex gap-2">
                    ${a.bestand > 0
                        ? `<button class="flex-1 bg-gray-800 hover:bg-teal-900 text-sm py-1.5 rounded"
                            data-id="${a.id}"
                            data-bezeichnung="${escapeHtml(a.bezeichnung)}"
                            data-preis="${a.preis}">
                            + Warenkorb
                          </button>`
                        : `<button disabled class="flex-1 bg-gray-800 text-gray-600 text-sm py-1.5 rounded">
                            Ausverkauft
                          </button>`
                    }
                    <button class="px-3 bg-gray-700 hover:bg-gray-600 rounded"
                        data-id="${a.id}"
                        data-bezeichnung="${escapeHtml(a.bezeichnung)}"
                        data-preis="${a.preis}"
                        data-bestand="${a.bestand}"
                        data-kategorie="${escapeHtml(a.kategorie || "")}">
                        ✏️
                    </button>
                </div>
            </div>
        `).join("");

        // Event Listeners für Buttons
        // "Warenkorb" Buttons
        artikelGrid.querySelectorAll("[data-id]").forEach(btn => {
            if (btn.textContent.includes("+ Warenkorb")) {
                btn.addEventListener("click", () => {
                    const artikel = {
                        id: parseInt(btn.dataset.id),
                        bezeichnung: btn.dataset.bezeichnung,
                        preis: parseFloat(btn.dataset.preis)
                    };
                    inWarenkorb(artikel);
                });
            }
            // "Edit" Buttons
            if (btn.textContent.includes("✏️")) {
                btn.addEventListener("click", () => {
                    const artikel = {
                        id: parseInt(btn.dataset.id),
                        bezeichnung: btn.dataset.bezeichnung,
                        preis: parseFloat(btn.dataset.preis),
                        bestand: parseInt(btn.dataset.bestand),
                        kategorie: btn.dataset.kategorie
                    };
                    openEditModal(artikel);
                });
            }
        });

    } catch (error) {
        console.error("Fehler beim Laden:", error);
        artikelGrid.innerHTML = '<p class="text-red-400 text-sm">Fehler beim Laden der Artikel.</p>';
    }
}

// Ware in Warenkorb
function inWarenkorb(artikel) {
    console.log("In Warenkorb:", artikel);

    const existierend = warenkorb.find(a => a.id === artikel.id);

    if (existierend) {
        existierend.menge++;
    } else {
        warenkorb.push({
            id: artikel.id,
            bezeichnung: artikel.bezeichnung,
            preis: artikel.preis,
            menge: 1
        });
    }

    renderWarenkorb();
    console.log("Warenkorb jetzt:", warenkorb);
}

// Warenkorb renderen
function renderWarenkorb() {
    console.log("Warenkorb renderen:", warenkorb);

    if (warenkorb.length === 0) {
        warenkorbListe.innerHTML = '<p class="text-sm text-gray-500">Noch keine Artikel.</p>';
        warenkorbAnzahl.textContent = "0";
        warenkorbGesamt.textContent = "0.00 €";
        return;
    }

    warenkorbListe.innerHTML = warenkorb.map(item => `
        <div class="bg-gray-800 rounded-lg p-3 flex justify-between items-center">
            <div>
                <p class="text-sm font-medium">${escapeHtml(item.bezeichnung)}</p>
                <p class="text-xs text-gray-400">${item.menge} × ${item.preis.toFixed(2)} €</p>
            </div>
            <div class="flex items-center gap-2">
                <button class="text-xs px-2 py-1 bg-gray-700 rounded minus-btn" data-id="${item.id}">−</button>
                <span class="text-sm">${item.menge}</span>
                <button class="text-xs px-2 py-1 bg-gray-700 rounded plus-btn" data-id="${item.id}">+</button>
            </div>
        </div>
    `).join("");

    // Gesamt berechnen
    const count = warenkorb.reduce((sum, item) => sum + item.menge, 0);
    const total = warenkorb.reduce((sum, item) => sum + item.preis * item.menge, 0);

    warenkorbAnzahl.textContent = count;
    warenkorbGesamt.textContent = `${total.toFixed(2)} €`;

    // +/- Buttons
    warenkorbListe.querySelectorAll(".plus-btn").forEach(btn => {
        btn.addEventListener("click", () => mengeAendern(parseInt(btn.dataset.id), 1));
    });

    warenkorbListe.querySelectorAll(".minus-btn").forEach(btn => {
        btn.addEventListener("click", () => mengeAendern(parseInt(btn.dataset.id), -1));
    });
}

// Menge ändern
function mengeAendern(id, delta) {
    const item = warenkorb.find(a => a.id === id);
    if (!item) return;

    item.menge += delta;

    if (item.menge <= 0) {
        warenkorb = warenkorb.filter(a => a.id !== id);
    }

    renderWarenkorb();
}

// Warenkorb leeren
function warenkorbLeeren() {
    warenkorb = [];
    renderWarenkorb();
}

// Edit Modal öffnen
function openEditModal(artikel) {
    editArtikelId = artikel.id;
    document.getElementById("edit-name").value = artikel.bezeichnung;
    document.getElementById("edit-preis").value = artikel.preis;
    document.getElementById("edit-bestand").value = artikel.bestand;
    document.getElementById("edit-kategorie").value = artikel.kategorie || "";
    editModal.classList.remove("hidden");
}

// Edit speichern (PUT)
async function saveArtikelUpdate() {
    if (!editArtikelId) return;

    const data = {
        bezeichnung: document.getElementById("edit-name").value.trim(),
        preis: parseFloat(document.getElementById("edit-preis").value),
        bestand: parseInt(document.getElementById("edit-bestand").value, 10),
        kategorie: document.getElementById("edit-kategorie").value.trim()
    };

    try {
        const response = await fetch(`/api/artikel/${editArtikelId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        if (!response.ok) {
            throw new Error("Speichern fehlgeschlagen");
        }

        editModal.classList.add("hidden");
        editArtikelId = null;
        await ladeArtikel();
    } catch (error) {
        console.error("Fehler:", error);
        alert("Fehler beim Speichern");
    }
}

// Bestellung aufgeben
async function bestellungAufgeben() {
    const name = document.getElementById("kunde-name").value.trim();
    const email = document.getElementById("kunde-email").value.trim();

    if (!name || !email) {
        alert("Bitte Name und E-Mail eingeben");
        return;
    }

    if (warenkorb.length === 0) {
        alert("Warenkorb ist leer");
        return;
    }

    try {
        // 1. Kunde suchen oder anlegen
        const namen = name.split(" ");
        const vorname = namen[0];
        const nachname = namen.slice(1).join(" ") || "-";

        // Kunde anlegen
        const kundeResponse = await fetch("/api/kunden", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                vorname,
                nachname,
                email
            })
        });

        if (!kundeResponse.ok) {
            throw new Error("Kunde fehlgeschlagen");
        }

        const kunde = await kundeResponse.json();
        console.log("Kunde:", kunde);

        // 2. Bestellung
        const bestellungResponse = await fetch("/api/bestellungen", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                kunde_id: kunde.id,
                status: "offen"
            })
        });

        if (!bestellungResponse.ok) {
            throw new Error("Bestellung fehlgeschlagen");
        }

        const bestellung = await bestellungResponse.json();
        console.log("Bestellung:", bestellung);

        // Warenkorb leeren & Modal zeigen
        warenkorbLeeren();
        toggleWarenkorb();
        erfolgModal.classList.remove("hidden");
    } catch (error) {
        console.error("Bestellung Error:", error);
        alert("Fehler bei der Bestellung");
    }
}

// *************** START ***************
console.log("Shop initialisiert");
renderWarenkorb();
ladeArtikel();
</script>

</body>
</html>
