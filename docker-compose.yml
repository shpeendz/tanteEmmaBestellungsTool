version: "3.9"

services:
  web:
    build: .
    container_name: tante-emma-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tanteemma.rule=Host(`${TANTE_EMMA_DOMAIN}`)"
      - "traefik.http.routers.tanteemma.entrypoints=web,websecure"
      - "traefik.http.routers.tanteemma.tls=true"
      - "traefik.http.routers.tanteemma.tls.certresolver=production"
      - "traefik.http.services.tanteemma.loadbalancer.server.port=5000"
    networks:
      - backend
      - traefik_default

  db:
    image: mariadb:10.11
    container_name: tante-emma-db
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

volumes:
  db_data: {}

networks:
  backend:
  traefik_default:
    external: true